[package]
name = "optic-timelapse"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Mac-side timelapse builder for Project Optic captures"
publish = false

# Standalone crate: not a member of the daemon's package, own Cargo.lock.
[workspace]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
