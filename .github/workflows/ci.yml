# CI gates for optic-daemon. Design: docs/optic-daemon-ci-cd.md.
# Mirrors the checks scripts/build-deploy-optic-daemon.sh runs on the Pi,
# and builds the release binary for the Pi's exact ABI (Debian 13 arm64,
# pinned Raspberry Pi libcamera). Nothing here deploys.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Docs-only changes skip the build jobs below. GitHub counts a required
  # check whose job was skipped by `if:` as passing, so the ruleset's two
  # required checks still resolve. Fails open: if this job fails, its output
  # is empty and both build jobs run. `timelapse` gates the macOS job for
  # tools/timelapse the same way (empty output means it runs).
  changes:
    name: Detect changed scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      timelapse: ${{ steps.scope.outputs.timelapse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          range=""
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push)
              if [[ -n $BEFORE && ! $BEFORE =~ ^0+$ ]]; then
                range="$BEFORE..$SHA"
              elif [[ -n $DEFAULT_BRANCH ]] &&
                git rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null; then
                # New branch (all-zero before): classify what it changed
                # since forking from the default branch.
                range="origin/$DEFAULT_BRANCH...$SHA"
              fi
              ;;
          esac
          if [[ -n $range ]] && files=$(git diff --name-only "$range"); then
            printf '%s\n' "$files"
            result=$(printf '%s\n' "$files" | scripts/ci-changed-scope.sh)
          else
            echo "No usable diff range for $EVENT; running full CI."
            result=$'docs_only=false\ntimelapse=true'
          fi
          echo "$result" | tee -a "$GITHUB_OUTPUT"

  web-lint:
    name: Biome (web assets)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.5.14
      # The checked file list lives in biome.json `files.includes`.
      - run: biome ci

  rust-arm64:
    name: Rust (Debian 13 arm64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Same bindgen inputs as the Pi build, but from system-installed packages.
      LIBCLANG_PATH: /usr/lib/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned native build dependencies
        run: scripts/ci-install-build-deps.sh

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml | head -n 1)
          [[ $channel =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad channel: $channel" >&2; exit 1; }
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs |
            sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          "$HOME/.cargo/bin/rustup" toolchain install "$channel" --profile minimal --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          rustc --version --verbose
          cargo --version
          cargo clippy --version
          gcc --version | head -n 1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo test
        run: cargo test --locked --all-targets

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo build --release
        run: cargo build --locked --release

      - name: Verify release binary
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          binary=target/release/optic-daemon
          test -x "$binary"
          ldd "$binary" | tee ldd.txt
          if grep -q 'not found' ldd.txt; then
            echo 'release binary has unresolved shared libraries' >&2
            exit 1
          fi
          grep -q 'libcamera.so.0.7' ldd.txt
          grep -q 'libturbojpeg.so.0' ldd.txt
          grep -aqF "$version" "$binary"
          echo "OPTIC_VERSION=$version" >> "$GITHUB_ENV"

      - name: Package artifact
        run: |
          name="optic-daemon-${OPTIC_VERSION}-aarch64-linux-gnu"
          dist="dist/$name"
          mkdir -p "$dist"
          install -m 0755 target/release/optic-daemon "$dist/optic-daemon"
          cp -r src/web "$dist/web"
          install -m 0644 systemd/optic-daemon.service "$dist/optic-daemon.service"
          printf '%s\n' "$OPTIC_VERSION" > "$dist/VERSION"
          printf '%s\n' "$GITHUB_SHA" > "$dist/COMMIT"
          (cd "$dist" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "dist/$name.sha256"
          mv "dist/$name.sha256" "$dist/SHA256SUMS"
          cat "$dist/SHA256SUMS"
          echo "ARTIFACT_NAME=$name-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # tools/timelapse is a separate Cargo workspace (a Mac-only tool), so the
  # root cargo commands above never build or test it. Runs only when the
  # tool or this CI definition changes; not a required check.
  # Design: docs/optic-daemon-ci-cd.md §5.1, docs/timelapse-builder.md.
  timelapse-macos:
    name: Timelapse tool (macOS)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.timelapse != 'false' }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      # Turns the encode/order integration test's "ffmpeg missing" skip
      # into a failure.
      OPTIC_REQUIRE_FFMPEG: "1"
    defaults:
      run:
        working-directory: tools/timelapse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' ../../rust-toolchain.toml | head -n 1)
          [[ $channel =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad channel: $channel" >&2; exit 1; }
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Show toolchain
        run: |
          rustc --version --verbose
          cargo --version
          cargo clippy --version
          ffmpeg -hide_banner -version | head -n 1
          sw_vers

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/timelapse -> target

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo test
        run: cargo test --locked --all-targets

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo build --release
        run: cargo build --locked --release
