# Installed by scripts/setup-optic-daemon-system-service.sh
# (docs/optic-daemon-system-service.md §2.3).
#
# optic-daemon is ordered after time-sync.target so captures and event
# timestamps never use the wrong clock left by a power cut (no RTC
# battery). The stock unit waits forever (TimeoutStartSec=infinity), which
# would keep the daemon from ever starting on a boot without network. Wait
# at most 90 s, then let boot continue: timeout's exit status 124 counts as
# success, so the unit does not show as failed.
[Service]
ExecStart=
ExecStart=/usr/bin/timeout 90 /usr/lib/systemd/systemd-time-wait-sync
SuccessExitStatus=124
TimeoutStartSec=100s
