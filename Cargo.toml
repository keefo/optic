[package]
name = "optic-daemon"
version = "0.1.24"
edition = "2024"
license = "MIT"
description = "Project Optic camera control daemon"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["json"] }
bytes = "1"
if-addrs = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.32", features = ["linux-tmpfs"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "linux")'.dependencies]
libcamera = { version = "0.7", features = ["vendor_draft", "vendor_rpi"] }
tiff = { version = "0.11", default-features = false }
turbojpeg-sys = { version = "0.2.3", default-features = false, features = ["pkg-config"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true